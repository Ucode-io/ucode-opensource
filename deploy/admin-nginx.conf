server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The admin panel is a single-page app: every unknown path is a client-side
    # route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
