# Builds and publishes the images the CLI pulls.
#
# Installing ucode must never mean compiling it: building the four Go services,
# running pnpm install and a Vite build is heavy enough to make a laptop
# unusable for several minutes. That work belongs here.
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PREFIX: ghcr.io/${{ github.repository_owner }}/ucode-opensource

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            dockerfile: deploy/Dockerfile.service
            service: auth
          - name: company
            dockerfile: deploy/Dockerfile.service
            service: company
          - name: gateway
            dockerfile: deploy/Dockerfile.service
            service: gateway
          - name: object-builder
            dockerfile: deploy/Dockerfile.service
            service: object-builder
          - name: migrate
            dockerfile: deploy/Dockerfile.migrate
            service: ''
          - name: admin
            dockerfile: deploy/Dockerfile.admin
            service: ''

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 matters: every Apple Silicon laptop pulls that one, and
          # emulating amd64 there is slow enough to look broken.
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
